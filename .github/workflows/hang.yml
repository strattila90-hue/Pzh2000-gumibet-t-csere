name: Hangfájlok gyártása
on:
  push:
    branches: [main]
    paths: ['src/steps.json', 'src/voice.json', 'tools/gen_audio.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install edge-tts
      - run: python tools/gen_audio.py
      - run: python build.py
      - name: Commit
        run: |
          git config user.name "hang-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio index.html
          git diff --cached --quiet || (git commit -m "Hangfájlok frissítése" && git push)
