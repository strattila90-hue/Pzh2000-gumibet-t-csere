<script>
// ===== IZOMETRIKUS RAJZMOTOR =====
const INK='#1b1b1b',OR='#F07D16',RD='#D62A1E',GN='#1F8A3B',BL='#1F6FD1';
const PAL={
 steel:['#eef0f2','#cfd3d8','#b3b8bf'],
 dsteel:['#c4c8ce','#a3a8b0','#888e97'],
 rub:['#4d4d4d','#333','#262626'],
 olive:['#a7b07a','#878f5c','#6c7448'],
 hull:['#dfe2d6','#c4c8b6','#a9ae99'],
 hl:['#ffc27a','#f59a3c','#dc7a17'],
 wood:['#e3c08a','#cfa465','#b88c4f'],
 mud:['#9c8463','#7e6a4d','#66563e'],
 conc:['#f2f1ec','#dddbd2','#c8c5b9'],
 grn:['#8fd19e','#4fb36b','#2f8a4a'],
 red:['#ff9a92','#e5483c','#bf2d22']
};
let OX=0,OY=0,SC=1;
const pj=(x,y,z)=>[OX+(x-y)*0.866*SC,OY+((x+y)*0.5-z)*SC];
const f1=n=>Math.round(n*10)/10;
const pts=a=>a.map(p=>f1(p[0])+','+f1(p[1])).join(' ');
const poly=(a,fill,sw=2,st=INK,extra='')=>`<polygon points="${pts(a)}" fill="${fill}" stroke="${st}" stroke-width="${sw}" stroke-linejoin="round" ${extra}/>`;
const poly3=(a,fill,sw=2,extra='')=>poly(a.map(p=>pj(...p)),fill,sw,INK,extra);
const line3=(a,sw=2,c=INK,extra='')=>`<polyline points="${pts(a.map(p=>pj(...p)))}" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
function box(x,y,z,w,d,h,pal='steel',sw=2){const c=PAL[pal]||pal;
 return poly3([[x+w,y,z],[x+w,y+d,z],[x+w,y+d,z+h],[x+w,y,z+h]],c[2],sw)+
  poly3([[x,y+d,z],[x+w,y+d,z],[x+w,y+d,z+h],[x,y+d,z+h]],c[1],sw)+
  poly3([[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]],c[0],sw);}
function hull2(P){P=P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);const lo=[],up=[];
 for(const p of P){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p)}
 for(const p of P.reverse()){while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p)}
 return lo.slice(0,-1).concat(up.slice(0,-1));}
// henger: tengely 'x'|'y'|'z', c = alap középpont, len a tengely mentén (+ irány a látható vég)
function ring(ax,c,r,n,off=0){const o=[];for(let k=0;k<n;k++){const a=k*2*Math.PI/n+off,u=r*Math.cos(a),v=r*Math.sin(a);
 o.push(ax==='x'?[c[0],c[1]+u,c[2]+v]:ax==='y'?[c[0]+u,c[1],c[2]+v]:[c[0]+u,c[1]+v,c[2]])}return o;}
function cyl(ax,c,r,len,pal='steel',n=28,sw=2,off=0){const col=PAL[pal]||pal;const e=ax==='x'?[c[0]+len,c[1],c[2]]:ax==='y'?[c[0],c[1]+len,c[2]]:[c[0],c[1],c[2]+len];
 const a=ring(ax,c,r,n,off),b=ring(ax,e,r,n,off);const side=hull2(a.concat(b).map(p=>pj(...p)));
 return poly(side,col[1],sw)+poly3(b,col[0],sw);}
const hex=(ax,c,r,len,pal='dsteel')=>cyl(ax,c,r,len,pal,6,2,Math.PI/6);
// ív nyíl tetszőleges síkban (forgásirány)
function arc3(ax,c,r,a0,a1,col=OR,sw=5){const P=[];const n=24;for(let k=0;k<=n;k++){const a=a0+(a1-a0)*k/n,u=r*Math.cos(a),v=r*Math.sin(a);
 P.push(ax==='x'?[c[0],c[1]+u,c[2]+v]:ax==='y'?[c[0]+u,c[1],c[2]+v]:[c[0]+u,c[1]+v,c[2]])}
 const s=P.map(p=>pj(...p));return `<polyline points="${pts(s)}" fill="none" stroke="#fff" stroke-width="${sw+5}" stroke-linecap="round"/><polyline points="${pts(s)}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" marker-end="url(#m_${col.slice(1)})"/>`;}
function arr3(a,b,col=OR,sw=6){const A=pj(...a),B=pj(...b);return `<line x1="${f1(A[0])}" y1="${f1(A[1])}" x2="${f1(B[0])}" y2="${f1(B[1])}" stroke="#fff" stroke-width="${sw+5}" stroke-linecap="round"/><line x1="${f1(A[0])}" y1="${f1(A[1])}" x2="${f1(B[0])}" y2="${f1(B[1])}" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" marker-end="url(#m_${col.slice(1)})"/>`;}
// 2D segédek
const L2=(d,w=2.5,c=INK)=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const R2=(x,y,w,h,f='#fff',rx=4,sw=2.5)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${f}" stroke="${INK}" stroke-width="${sw}"/>`;
const C2=(x,y,r,f='#fff',sw=2.5)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" stroke="${INK}" stroke-width="${sw}"/>`;
const TX=(x,y,t,s=15,a='middle',c=INK,w=800)=>`<text x="${x}" y="${y}" font-size="${s}" font-weight="${w}" text-anchor="${a}" fill="${c}" font-family="Inter,Helvetica Neue,Arial,sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">${t}</text>`;
const A2=(x1,y1,x2,y2,col=OR,sw=6)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#fff" stroke-width="${sw+5}" stroke-linecap="round"/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" marker-end="url(#m_${col.slice(1)})"/>`;

function man(x,y,s=1,pose='stand',flip=false){
 const P={stand:{b:[0,0],h:[0,-58],a:[[-14,-6],[14,-6]],f:[[-8,38],[8,38]]},
 signal:{b:[0,0],h:[0,-58],a:[[-30,-62],[30,-62]],f:[[-8,38],[8,38]]},
 point:{b:[0,0],h:[0,-58],a:[[-14,-6],[40,-36]],f:[[-8,38],[8,38]]},
 lift:{b:[6,8],h:[18,-40],a:[[26,22],[34,18]],f:[[-6,38],[20,38]],bend:1},
 push:{b:[4,0],h:[8,-56],a:[[40,-24],[40,-14]],f:[[-14,38],[12,38]]},
 hammer:{b:[0,0],h:[0,-58],a:[[22,-74],[18,-66]],f:[[-10,38],[10,38]]},
 hold:{b:[6,10],h:[14,-38],a:[[36,8],[30,16]],f:[[-6,38],[18,38]],bend:1},
 kneel:{b:[0,14],h:[6,-36],a:[[30,12],[26,18]],f:[[-14,38],[20,38]],bend:1}}[pose];
 const W='#ffffff',UN='#6f7a4a';
 const limb=(a,b,w,c)=>`<path d="M${a[0]} ${a[1]} L${b[0]} ${b[1]}" stroke="${INK}" stroke-width="${w+5}" stroke-linecap="round"/><path d="M${a[0]} ${a[1]} L${b[0]} ${b[1]}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
 const hip=[P.b[0],P.b[1]+4],sh=[ (P.h[0]+P.b[0])/2+(P.bend?6:0), P.h[1]+20];
 let g=P.f.map(f=>limb(hip,f,12,'#55603a')).join('')+P.f.map(f=>`<ellipse cx="${f[0]+3}" cy="${f[1]+3}" rx="9" ry="5" fill="${INK}"/>`).join('');
 g+=`<path d="M${sh[0]-15} ${sh[1]-4} Q${sh[0]} ${sh[1]-12} ${sh[0]+15} ${sh[1]-4} L${hip[0]+13} ${hip[1]} L${hip[0]-13} ${hip[1]} Z" fill="${UN}" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>`;
 g+=P.a.map(a=>limb(sh,a,9,UN)).join('');
 g+=`<circle cx="${P.h[0]}" cy="${P.h[1]}" r="13" fill="${W}" stroke="${INK}" stroke-width="2.5"/>`;
 g+=P.a.map(a=>`<circle cx="${a[0]}" cy="${a[1]}" r="7.5" fill="${OR}" stroke="${INK}" stroke-width="2.5"/>`).join('');
 return G2(`translate(${x} ${y}) scale(${flip?-s:s} ${s})`,g);
}

// ===== ALKATRÉSZEK IZOMETRIKUSAN =====
// lánctag: szélesség x irányban (W), haladási irány y; z felfelé. pads: 'ok' | 'none' | 'old' | 'hl' | 'lift'
const W=150,PIT=50;
function link(x,y,z,o={}){const p=o.pads||'ok';let g='';
 const pin=(yy)=>cyl('x',[x-8,yy,z+8],6.5,W+16,'dsteel',18);
 g+=pin(y);
 g+=box(x,y-2,z,W,34,16,o.body||'steel');
 g+=poly3([[x+8,y+4,z+16],[x+W-8,y+4,z+16],[x+W-8,y+28,z+16],[x+8,y+28,z+16]],'#b9bdc4',1.2);
 const pad=(px,pal,lift=0)=>box(px,y+2,z+16+lift,58,28,12,pal);
 const nest=(px,muddy)=>poly3([[px,y+2,z+16],[px+58,y+2,z+16],[px+58,y+30,z+16],[px,y+30,z+16]],muddy?PAL.mud[1]:'#7d8188',1.5)+(muddy?[[12,8],[30,18],[44,10]].map(([a,b])=>poly3([[px+a,y+b,z+16.5],[px+a+8,y+b,z+16.5],[px+a+8,y+b+5,z+16.5],[px+a,y+b+5,z+16.5]],PAL.mud[2],1)).join(''):'')+line3([[px+8,y+15,z+16],[px+50,y+15,z+16]],1.2,'#555');
 const L=p==='none'||p==='mud'?nest(x+8,p==='mud'):pad(x+8,p==='old'?'rub':p==='hl'?'hl':'rub');
 const Rr=p==='none'||p==='mud'?nest(x+W-66,p==='mud'):pad(x+W-66,p==='hl'?'hl':'rub',p==='lift'?18:0);
 g+=L+Rr;
 g+=pin(y+PIT-16);
 return g;}
function endConn(x,y,z,pal='steel'){ // szélső összekötő a +x oldalon, y..y+PIT között
 return box(x,y-12,z-2,14,PIT+8,20,pal)+cyl('x',[x+14,y+(PIT-16)/2,z+8],7,5,'dsteel',6,2,Math.PI/6);}
function centerConn(x,y,z,pal='steel'){return box(x-12,y-10,z+14,24,PIT+4,10,pal)+hex('z',[x,y+(PIT-16)/2,z+24],8,8);}
function trackPiece(n,o={}){ // n tag sorban, y irányban
 let g='';for(let k=0;k<n;k++){const yy=k*PIT;g+=link(0,yy,0,{pads:(o.pads&&o.pads[k])||o.pad||'ok',body:o.body});
  if(k<n-1&&o.conn!==false){g+=centerConn(W/2,yy+PIT-16+0,0,o.hlC===k?'hl':'steel');}}
 if(o.endR!==false)for(let k=0;k<n-1;k++)g+=endConn(W+8,k*PIT+PIT-16-8,0,o.hlE===k?'hl':'steel');
 return g;}

function trackSide(y0,near){let g='';const L0=-20,L1=380;
 g+=box(L0,y0,4,L1-L0,40,52,'rub');
 if(near){for(let k=0;k<7;k++)g+=cyl('y',[30+k*44,y0+40,34],21,6,'dsteel',22)+cyl('y',[30+k*44,y0+46,34],7,2,'steel',12);
  g+=cyl('y',[-6,y0+40,40],20,6,'dsteel',22)+cyl('y',[362,y0+40,44],22,6,'olive',12);
  for(let k=0;k<26;k++){const xx=L0+8+k*15;g+=line3([[xx,y0+40,4],[xx,y0+40,10]],1.3,'#888')}}
 return g;}
function vehicle(o={}){let g='';
 g+=trackSide(-40,false);
 g+=box(-10,0,30,370,150,40,'hull');
 g+=poly3([[360,0,70],[400,0,40],[400,150,40],[360,150,70]],PAL.hull[0])+poly3([[360,150,30],[400,150,40],[360,150,70]],PAL.hull[1])+poly3([[360,150,30],[400,150,30],[400,150,40]],PAL.hull[1]);
 g+=box(-10,150,30,370,10,40,'olive');
 g+=box(10,10,70,200,130,62,'hull');
 g+=poly3([[210,10,132],[250,20,100],[250,130,100],[210,140,132]],PAL.hull[0])+poly3([[210,140,70],[250,130,70],[250,130,100],[210,140,132]],PAL.hull[1]);
 g+=box(40,20,132,40,40,14,'hull')+box(120,90,132,50,30,8,'hull');
 g+=cyl('x',[250,75,104],10,60,'hull',16)+cyl('x',[310,75,104],6.5,190,'hull',14)+cyl('x',[400,75,104],10,30,'hull',14)+box(500,64,95,24,22,18,'dsteel');
 for(let k=0;k<5;k++)g+=poly3([[20+k*38,140,82],[52+k*38,140,82],[52+k*38,140,118],[20+k*38,140,118]],PAL.hull[1],1.5);
 g+=trackSide(160,true);
 if(o.skirt)g+=poly3([[-10,200,90],[360,200,90],[360,240,96],[-10,240,96]],PAL.olive[0])+'';
 return g;}
const vehSVG=(ox,oy,sc,o)=>{cam(ox,oy,sc);return vehicle(o);};

// ===== FESZÍTŐ (hátsó feszítőgörgő + feszítő berendezés), izometrikusan =====
function tensioner(o={}){let g='';const hc=[70,0,80]; // görgő agy (x,z), y=0 a külső sík
 g+=poly3([[150,-60,60],[330,-60,60],[330,-60,170],[150,-60,170]],'#e7e9e2',1.5);
 // lánc az ív mögött
 const R0=62,TH=14;const tPts=[];
 const slack=o.slack?18:0;
 // felső ág
 for(let k=0;k<9;k++){const xx=hc[0]+k*30;g+=box(xx,-14,hc[2]+R0-2+(o.slack&&k>2?-(k-2)*1.2:0),28,44,TH,'rub',1.5);}
 // ív (hátsó félkör) szegmensek
 for(let k=1;k<12;k++){const a=Math.PI/2+k*Math.PI/12;const cx=hc[0]+(R0+7)*Math.cos(a),cz=hc[2]+(R0+7)*Math.sin(a);
  const t=[-Math.sin(a),Math.cos(a)],nn=[Math.cos(a),Math.sin(a)];const hw=9,ht=7;
  const c4=[[cx-t[0]*hw-nn[0]*ht,cz-t[1]*hw-nn[1]*ht],[cx+t[0]*hw-nn[0]*ht,cz+t[1]*hw-nn[1]*ht],[cx+t[0]*hw+nn[0]*ht,cz+t[1]*hw+nn[1]*ht],[cx-t[0]*hw+nn[0]*ht,cz-t[1]*hw+nn[1]*ht]];
  g+=poly3(c4.map(p=>[p[0],30,p[1]]),PAL.rub[1],1.5)+poly3([[c4[2][0],-14,c4[2][1]],[c4[3][0],-14,c4[3][1]],[c4[3][0],30,c4[3][1]],[c4[2][0],30,c4[2][1]]],PAL.rub[0],1.2);}
 // alsó ág
 for(let k=0;k<9;k++){const xx=hc[0]+k*30;g+=box(xx,-14,hc[2]-R0-TH+2-(o.slack?Math.min(k,5)*3:0),28,44,TH,'rub',1.5);}
 // görgő
 g+=cyl('y',[hc[0],-6,hc[2]],R0-4,30,'dsteel',36)+cyl('y',[hc[0],24,hc[2]],R0-16,3,'steel',36)+cyl('y',[hc[0],27,hc[2]],16,6,'dsteel',20);
 // kar a feszítőhöz
 g+=poly3([[hc[0],30,hc[2]+6],[hc[0]+90,30,hc[2]+40],[hc[0]+96,30,hc[2]+26],[hc[0]+4,30,hc[2]-8]],PAL.olive[1]);
 // feszítő berendezés (a test mellett, kicsit kint)
 const tx=hc[0]+96+(o.slack?-16:0),tz=hc[2]+34;
 g+=box(tx,0,tz-18,70,34,36,o.hlBody?'hl':'olive');
 g+=cyl('x',[tx+70,17,tz],10,40,o.hlScrew?'hl':'steel',20);
 for(let k=0;k<5;k++)g+=line3(ring('x',[tx+76+k*7,17,tz],10.5,10).concat([ring('x',[tx+76+k*7,17,tz],10.5,10)[0]]).slice(0,6),1.2,'#666');
 g+=hex('x',[tx+82,17,tz],14,12,o.hlScrew?'hl':'dsteel');
 const capX=o.capOff?tx+150:tx+110;
 if(o.capOff)g+=cyl('x',[tx+110,17,tz],9,6,'steel',16);
 g+=cyl('x',[capX,17,tz],13,24,o.hlCap?'hl':'olive',24);
 g+=box(tx+40,-60,tz-14,40,60,10,'olive');
 return {g,cap:[capX+24,17,tz],nut:[tx+94,17,tz],hub:[hc[0],30,hc[2]]};}

 return g+p([30,16,28],1,40,40)+p([W/2,PIT-8,26],2,200,24)+p([W+16,PIT-14,10],3,370,150)+p([60,PIT-16,8],4,60,250)+'';};
const KN_TENS=()=>{cam(60,210,0.74);const t=tensioner({});const p=(a,n,tx,ty)=>{const q=at(a);return L2(`M${q[0]} ${q[1]} L${tx} ${ty}`,1.6)+tagN(tx,ty,n,OR)};
 return t.g+p([t.cap[0]-10,17,t.cap[2]+10],1,370,60)+p([t.nut[0]-6,17,t.nut[2]+12],2,300,40)+p([t.nut[0]-50,17,t.nut[2]+16],3,220,40)+p([70,30,150],4,60,40);};

// ===== MUNKAZENE – saját, generált (WebAudio), induló jellegű ösztönző zene =====
// Nincs hangfájl, nincs szerzői jog: valós időben generálódik, a feladat becsült hosszáig szól.
// Beszéd közben automatikusan lehalkul.
const MZ={on:false,vol:0.55,mins:270,start:0,end:0,ctx:null,master:null,duck:null,timer:null,next:0,step:0,bar:0,seed:7,noise:null};
try{Object.assign(MZ,JSON.parse(localStorage.getItem('pzh2music')||'{}'),{on:false})}catch(e){}
const mzSave=()=>{try{localStorage.setItem('pzh2music',JSON.stringify({vol:MZ.vol,mins:MZ.mins}))}catch(e){}};
// becsült idők szakaszonként (perc / oldal): előkészítés, lazítás-nyitás, betétcsere, visszaszerelés, feszítés-ellenőrzés
const PHASE_MIN=[30,40,120,45,35];
const mzRnd=()=>{MZ.seed=(MZ.seed*1664525+1013904223)>>>0;return MZ.seed/4294967296};
const PROG=[[50,53,57],[46,50,53],[53,57,60],[48,52,55],[50,53,57],[45,49,52],[46,50,53],[45,49,52]]; // Dm Bb F C Dm A Bb A
const SCALE=[62,64,65,67,69,70,72,74,76,77];
const hz=m=>440*Math.pow(2,(m-69)/12);
function mzInit(){if(MZ.ctx)return;const C=new (window.AudioContext||window.webkitAudioContext)();MZ.ctx=C;
 MZ.master=C.createGain();MZ.master.gain.value=0;MZ.duck=C.createGain();MZ.duck.gain.value=1;
 const comp=C.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=4;
 MZ.duck.connect(MZ.master);MZ.master.connect(comp);comp.connect(C.destination);
 const b=C.createBuffer(1,C.sampleRate,C.sampleRate),d=b.getChannelData(0);for(let k=0;k<d.length;k++)d[k]=Math.random()*2-1;MZ.noise=b;}
function env(g,t,a,peak,dcy){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dcy)}
function kick(t,v=1){const C=MZ.ctx,o=C.createOscillator(),g=C.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(42,t+0.12);env(g,t,0.003,0.9*v,0.28);o.connect(g).connect(MZ.duck);o.start(t);o.stop(t+0.35)}
function snare(t,v=1){const C=MZ.ctx,s=C.createBufferSource(),f=C.createBiquadFilter(),g=C.createGain();s.buffer=MZ.noise;f.type='bandpass';f.frequency.value=1800;f.Q.value=0.8;env(g,t,0.002,0.45*v,0.14);s.connect(f).connect(g).connect(MZ.duck);s.start(t);s.stop(t+0.2);
 const o=C.createOscillator(),g2=C.createGain();o.frequency.value=190;env(g2,t,0.002,0.25*v,0.08);o.connect(g2).connect(MZ.duck);o.start(t);o.stop(t+0.12)}
function hat(t,v=1){const C=MZ.ctx,s=C.createBufferSource(),f=C.createBiquadFilter(),g=C.createGain();s.buffer=MZ.noise;f.type='highpass';f.frequency.value=7000;env(g,t,0.001,0.12*v,0.04);s.connect(f).connect(g).connect(MZ.duck);s.start(t);s.stop(t+0.06)}
function bass(t,m,dur){const C=MZ.ctx,o=C.createOscillator(),f=C.createBiquadFilter(),g=C.createGain();o.type='sawtooth';o.frequency.value=hz(m-12);f.type='lowpass';f.frequency.value=420;env(g,t,0.01,0.32,dur);o.connect(f).connect(g).connect(MZ.duck);o.start(t);o.stop(t+dur+0.05)}
function pad(t,ch,dur,v){const C=MZ.ctx,f=C.createBiquadFilter(),g=C.createGain();f.type='lowpass';f.frequency.value=1100;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.07*v,t+0.4);g.gain.linearRampToValueAtTime(0.0001,t+dur);f.connect(g).connect(MZ.duck);
 ch.forEach(m=>[-6,6].forEach(dt=>{const o=C.createOscillator();o.type='sawtooth';o.frequency.value=hz(m);o.detune.value=dt;o.connect(f);o.start(t);o.stop(t+dur+0.05)}))}
function brass(t,m,dur,v){const C=MZ.ctx,o=C.createOscillator(),f=C.createBiquadFilter(),g=C.createGain(),l=C.createOscillator(),lg=C.createGain();o.type='sawtooth';o.frequency.value=hz(m);l.frequency.value=5.5;lg.gain.value=3;l.connect(lg).connect(o.detune);
 f.type='lowpass';f.frequency.setValueAtTime(600,t);f.frequency.linearRampToValueAtTime(2400,t+0.08);f.frequency.linearRampToValueAtTime(1300,t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.13*v,t+0.05);g.gain.setValueAtTime(0.11*v,t+dur*0.8);g.gain.linearRampToValueAtTime(0.0001,t+dur);
 o.connect(f).connect(g).connect(MZ.duck);o.start(t);l.start(t);o.stop(t+dur+0.05);l.stop(t+dur+0.05)}
let MEL=[];function newMelody(){MEL=[];let p=4;for(let k=0;k<16;k++){p=Math.max(0,Math.min(SCALE.length-1,p+[-2,-1,0,1,1,2][Math.floor(mzRnd()*6)]));MEL.push(mzRnd()<0.22?null:SCALE[p])}}
function intensity(){const ph=typeof i!=='undefined'&&i>=0&&typeof phOf==='function'?phOf(i):0;return [0.6,0.8,1,0.85,0.95][ph]||0.7}
function schedule(){const C=MZ.ctx;const bpm=104+Math.round(intensity()*14),q=60/bpm/2; // nyolcad
 while(MZ.next<C.currentTime+0.15){const t=MZ.next,s=MZ.step%16,bar=MZ.bar,ch=PROG[bar%8],I=intensity();
  if(s===0){if(bar%8===0)newMelody();pad(t,ch,q*16,I)}
  if(s%8===0)kick(t);if(s===6&&I>0.7)kick(t,0.6);if(s%8===4)snare(t);if(I>0.75&&s===14&&bar%4===3){snare(t,0.5);snare(t+q/2,0.6)}
  if(bar%4===3&&s>=12){snare(t,0.35+0.1*(s-12))}
  hat(t,s%2?0.6:1);
  if(s%2===0)bass(t,s%8===6?ch[2]:ch[0],q*1.6);
  if(I>=0.8&&bar%2===1&&s%2===0){const m=MEL[(s/2+(bar%4)*8/2)%16];if(m)brass(t,m,q*1.8,I)}
  MZ.next+=q;MZ.step++;if(MZ.step%16===0)MZ.bar++;}
 const speaking=(window.speechSynthesis&&speechSynthesis.speaking)||(typeof curA!=='undefined'&&curA&&!curA.paused);
 MZ.duck.gain.setTargetAtTime(speaking?0.18:1,C.currentTime,0.15);
 if(Date.now()>=MZ.end){mzStop(true)}mzUI()}
function mzStart(){mzInit();const C=MZ.ctx;if(C.state==='suspended')C.resume();MZ.on=true;if(!MZ.end||Date.now()>=MZ.end){MZ.start=Date.now();MZ.end=MZ.start+MZ.mins*60000}
 MZ.next=C.currentTime+0.05;MZ.master.gain.cancelScheduledValues(C.currentTime);MZ.master.gain.setTargetAtTime(MZ.vol*0.5,C.currentTime,0.6);clearInterval(MZ.timer);MZ.timer=setInterval(schedule,40);mzUI()}
function mzStop(fin){if(!MZ.ctx)return;MZ.on=false;clearInterval(MZ.timer);MZ.master.gain.setTargetAtTime(0,MZ.ctx.currentTime,fin?1.2:0.3);if(fin){MZ.end=0}mzUI()}
function mzVol(v){MZ.vol=v;mzSave();if(MZ.ctx&&MZ.on)MZ.master.gain.setTargetAtTime(v*0.5,MZ.ctx.currentTime,0.1)}
const fmtLeft=()=>{if(!MZ.end)return'';const m=Math.max(0,Math.round((MZ.end-Date.now())/60000));return Math.floor(m/60)+':'+String(m%60).padStart(2,'0')};
function mzUI(){document.querySelectorAll('[data-mz]').forEach(e=>{e.classList.toggle('on',MZ.on);e.textContent=MZ.on?'♪ '+fmtLeft():'♪'});const s=document.getElementById('mzst');if(s)s.textContent=MZ.on?'Szól – hátralévő idő: '+fmtLeft()+' (óra:perc)':MZ.end?'Szünetel – hátralévő: '+fmtLeft():'Áll.'}
function musicPanel(){const h=Math.floor(MZ.mins/60),m=MZ.mins%60;return `<div class="vp"><b>Munkazene</b><p class="hint">Saját generált, induló jellegű ösztönző zene. Pontosan addig szól, ameddig a feladat becsült ideje tart; munka közben a szakaszhoz igazodik, beszédnél lehalkul.</p>
 <label>Becsült idő / oldal: <span id="mzt">${h} óra ${m} perc</span><input type="range" id="mzm" min="60" max="600" step="15" value="${MZ.mins}"></label>
 <label>Hangerő <input type="range" id="mzv" min="0" max="1" step="0.05" value="${MZ.vol}"></label>
 <div class="two"><button class="sec" id="mzgo">${MZ.on?'Szünet':'Indítás'}</button><button class="sec" id="mzrs">Újrakezd</button></div><div class="hint" id="mzst"></div></div>`}
function bindMusic(){$('mzm').oninput=e=>{MZ.mins=+e.target.value;mzSave();$('mzt').textContent=Math.floor(MZ.mins/60)+' óra '+MZ.mins%60+' perc';if(MZ.on){MZ.end=MZ.start+MZ.mins*60000}};
 $('mzv').oninput=e=>mzVol(+e.target.value);$('mzgo').onclick=e=>{MZ.on?mzStop():mzStart();e.target.textContent=MZ.on?'Szünet':'Indítás'};$('mzrs').onclick=()=>{MZ.end=0;mzStart();$('mzgo').textContent='Szünet'};mzUI()}

 <h2>Beállítás</h2><label class="chk"><input type="radio" name="tg" value="95" ${WK.tags==95?'checked':''}> 95 tagos lánc (190 betét)</label><label class="chk"><input type="radio" name="tg" value="94" ${WK.tags==94?'checked':''}> 94 tagos lánc (188 betét)</label>
 <label class="chk"><input type="radio" name="sd" value="jobb" ${WK.side==='jobb'?'checked':''}> Jobb oldalon kezdünk</label><label class="chk"><input type="radio" name="sd" value="bal" ${WK.side==='bal'?'checked':''}> Bal oldalon kezdünk</label>
 ${LOG.length?'<button class="sec" id="clr">Napló törlése</button>':''}</div>`;
 $('bk').onclick=home;document.querySelectorAll('input[name=tg]').forEach(x=>x.onchange=()=>{WK.tags=+x.value;saveW()});document.querySelectorAll('input[name=sd]').forEach(x=>x.onchange=()=>{WK.side=x.value;saveW()});
 const c=$('clr');if(c)c.onclick=()=>{c.textContent='Biztos? Koppints újra a törléshez';c.onclick=()=>{LOG=[];saveLog();logView()}};window.scrollTo(0,0);}
function setNight(on){document.documentElement.classList.toggle('night',on);try{localStorage.setItem('pzh2night',on?'1':'0')}catch(e){}}
try{setNight(localStorage.getItem('pzh2night')==='1')}catch(e){}
function media(){if(!('mediaSession' in navigator))return;try{const ms=navigator.mediaSession;ms.metadata=new MediaMetadata({title:(i+1)+'. '+STEPS[i].t,artist:'PzH2000 gumibetét csere',album:PH[phOf(i)].t});
 ms.setActionHandler('nexttrack',()=>{const b=$('dn');b&&b.click()});ms.setActionHandler('previoustrack',()=>{i>0&&go(i-1)});
 ms.setActionHandler('play',()=>{const b=$('rp');b&&b.click()});ms.setActionHandler('pause',()=>hush())}catch(e){}}
function list(){i=-1;hush();let cur=-1;try{cur=+(localStorage.getItem('pzh2step')??-1)}catch(e){}let mk=true;
 app.innerHTML=`<div class="page wh">${NAV}<div class="kick">Hol járunk?</div><h1 class="ht">Válaszd ki a lépést</h1>
 <div class="two sd"><button class="sec ${WK.side==='jobb'?'on':''}" data-s="jobb">Jobb oldal</button><button class="sec ${WK.side==='bal'?'on':''}" data-s="bal">Bal oldal</button></div>
 <div class="phj">${PH.map((p,k)=>`<button data-p="${k}" class="${phOf(cur)===k?'on':''}"><b>${k+1}</b>${p.t}</button>`).join('')}</div>
 <label class="chk"><input type="checkbox" id="mk" checked> Az előző lépéseket jelölje késznek</label>
 ${PH.map((p,k)=>`<h2 id="ph${k}">${k+1}. ${p.t}</h2>`+STEPS.slice(p.a,p.b+1).map((s,j)=>{const n=p.a+j;return `<a class="li${n===cur?' cur':''}" data-k="${n}"><b>${n+1}</b>${s.t}${n===cur?'<em class="here">itt tartunk</em>':done.has(n)?'<em>✓</em>':''}</a>`}).join('')).join('')}</div>`;
 $('bk').onclick=home;$('mk').onchange=e=>mk=e.target.checked;
 app.querySelectorAll('.sd button').forEach(b=>b.onclick=()=>{WK.side=b.dataset.s;saveW();app.querySelectorAll('.sd button').forEach(x=>x.classList.toggle('on',x===b))});
 app.querySelectorAll('.phj button').forEach(b=>b.onclick=()=>{const h=$('ph'+b.dataset.p);h&&h.scrollIntoView({behavior:'smooth',block:'start'})});
 app.querySelectorAll('.li').forEach(a=>a.onclick=()=>{const k=+a.dataset.k;if(mk){for(let j=0;j<STEPS.length;j++){j<k?done.add(j):done.delete(j)}}if(!WK.start)WK.start=Date.now();saveW();go(k)});
 const c=app.querySelector('.li.cur');c?c.scrollIntoView({block:'center'}):window.scrollTo(0,0);}
function go(n){i=Math.max(0,Math.min(STEPS.length-1,n));saveDone();const s=STEPS[i],last=i===STEPS.length-1,dn=done.has(i);
 app.innerHTML=`<div class="step"><div class="bar"><button class="mb" id="bk">⌂ Főmenü</button><span class="sp1"></span><button class="vb mzb" data-mz id="mzb">♪</button><button class="vb" id="vt">${voiceOn?'🔊':'🔇'}</button></div>${timeline(i)}
 <div class="top" id="tp"><div class="no${dn?' ok':''}">${i+1}</div><div class="tt"><small>${PH[phOf(i)].t} · ${WK.side==="jobb"?"jobb":"bal"} oldal <span class="chg">▾ hol járunk?</span></small><h1>${s.t}</h1></div></div>
 <div class="lvw" id="lvw">${i===2?toolsList():`<p class="lv" id="lv">${split(s.v).map(x=>`<span data-sp>${x}</span>`).join(' ')}</p>`}</div>
 ${WG[i]?WG[i][0]():''}
 ${TL[i]?`<div class="tools"><b>Kell hozzá:</b> ${TL[i].map(k=>`<span>${TOOL[k][0]}</span>`).join('')}</div>`:''}
 ${s.w?`<div class="warn"><i>!</i><div>${s.w}</div></div>`:''}
 <div class="dock"><button class="sm" id="pv">‹</button><button class="big ${dn?'is':''}" id="dn">${dn?'✓ Kész · tovább':last?'✓ Kész':'✓ Kész – jöhet a következő'}</button><button class="sm" id="rp">↻</button></div></div>`;
 fit();if(WG[i])WG[i][1]();media();
 $('bk').onclick=home;$('tlb').onclick=list;$('tp').onclick=list;$('mzb').onclick=()=>{MZ.on?mzStop():mzStart()};mzUI();
 $('pv').onclick=()=>i===0?home():go(i-1);
 const SP=()=>[...document.querySelectorAll('#lv [data-sp]')];if(i===2)bindToolsList();$('rp').onclick=()=>speak(s.v,SP(),(i+1)+'. lépés:');
 $('vt').onclick=e=>{voiceOn=!voiceOn;e.target.textContent=voiceOn?'🔊':'🔇';if(!voiceOn)hush()};
 $('dn').onclick=e=>{const bt=e.currentTarget;if(bt.dataset.busy)return;bt.dataset.busy=1;if(dn){last?finish():go(i+1);return}done.add(i);saveDone();beep();try{speechSynthesis.cancel()}catch(e){}
  const ov=document.createElement('div');ov.className='ov';ov.innerHTML='<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#1F8A3B"/><path d="M28 52 L44 67 L73 36" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>';document.body.appendChild(ov);
  setTimeout(()=>{ov.remove();if(!bt.isConnected)return;last?finish():go(i+1)},900)};
 window.scrollTo(0,0);i===2?fitGrid():fitText();wake();speak(s.v,SP(),(i+1)+'. lépés:');}
function finish(){i=-1;const min=WK.start?Math.round((Date.now()-WK.start)/60000):0;LOG.push({d:new Date().toLocaleString('hu-HU'),side:WK.side,ki:WK.ki,be:WK.be,mm:WK.mm,min});saveLog();const other=WK.side==='jobb'?'bal':'jobb';
 app.innerHTML=`<div class="page">${NAV}<h1 class="ht">${WK.side==='jobb'?'Jobb':'Bal'} oldal kész!</h1><div class="lg">Régi ki: <b>${WK.ki}</b> · Új be: <b>${WK.be}</b> / ${target()} · Feszesség: <b>${WK.mm??'–'} mm</b> · Idő: <b>${min} perc</b></div><p class="lead">Következik: <b>${other} oldal</b>, a zárókupaktól (6. lépés).</p><div class="warn"><i>!</i><div><b>A feszítő iránya ott fordított!</b> ${other==='jobb'?'Jobb':'Bal'} oldalon ${dirTxt(other,0).toLowerCase()} lazít.</div></div><button class="cta" id="o">${other==='jobb'?'Jobb':'Bal'} oldal indítása</button><button class="sec" id="h">Kezdőlap</button></div>`;
 fit();speak(VX.finish);$('o').onclick=()=>{[...done].forEach(k=>{if(k>=5)done.delete(k)});saveDone();WK.side=other;WK.ki=0;WK.be=0;WK.mm=null;WK.start=Date.now();saveW();go(5)};$('h').onclick=home;$('bk').onclick=home;}
let sx=null;document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});document.addEventListener('touchend',e=>{if(sx===null||i<0)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>80){dx<0?(i<STEPS.length-1&&go(i+1)):(i>0&&go(i-1))}sx=null});
location.hash==='#nyomtat'?printView():home();

if('serviceWorker' in navigator&&(location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname))){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
